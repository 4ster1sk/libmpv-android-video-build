name: Build libmpv-android

on:
  push:
    branches:
      - 16kb-page-sizes
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VER: 28.2.13676358

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Gradle Build Action
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Cache
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VER }}
          key: ${{ runner.os }}-${{ env.NDK_VER }}
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Bundle (default)
        working-directory: ./buildscripts
        run: |
          sudo chmod +x bundle_default.sh
          ./bundle_default.sh
      - uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ./output/*
      - uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/16kb-page-sizes'
        with:
          draft: true
          prerelease: false
          tag_name: "vnext"
          files: |
            output/*
